<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Belge Yöneticisi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --ink:#12213a;
    --ink-2:#1c3157;
    --paper:#f6f1e4;
    --paper-2:#ede4cf;
    --stamp:#b8863a;
    --stamp-dark:#8f6526;
    --ok:#3d6b4f;
    --warn:#b8863a;
    --danger:#a4402f;
    --line:#d8cdb1;
    --text:#241a0f;
    --text-dim:#6b6050;
    --radius:10px;
    --shadow:0 2px 10px rgba(18,33,58,0.10);
    --shadow-lg:0 12px 32px rgba(18,33,58,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,134,58,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(184,134,58,0.06), transparent 40%);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    min-height:100vh;
  }
  .mono{ font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing:0.02em; }

  /* ---------- PIN SCREEN ---------- */
  #pinScreen{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(184,134,58,0.14), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(184,134,58,0.10), transparent 45%);
  }
  .pin-card{ width:min(340px, 88vw); text-align:center; }
  .pin-seal{
    width:64px;height:64px;margin:0 auto 18px;
    border:2px solid var(--stamp); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--stamp); font-size:26px;
    box-shadow:0 0 0 4px rgba(184,134,58,0.12);
  }
  .pin-title{ color:var(--paper); font-size:20px; font-weight:700; margin:0 0 4px; letter-spacing:0.01em;}
  .pin-sub{ color:#a9b6cd; font-size:13px; margin:0 0 26px; }
  .pin-dots{ display:flex; gap:14px; justify-content:center; margin-bottom:26px; }
  .pin-dot{ width:14px; height:14px; border-radius:50%; border:1.5px solid #5b6c8c; transition:all .15s; }
  .pin-dot.filled{ background:var(--stamp); border-color:var(--stamp); }
  .pin-dot.err{ background:var(--danger); border-color:var(--danger); }
  .pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pin-key{
    padding:16px 0; font-size:20px; font-weight:600; color:var(--paper);
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
    border-radius:12px; cursor:pointer; user-select:none;
  }
  .pin-key:active{ background:rgba(184,134,58,0.25); }
  .pin-key.ghost{ background:transparent; border:none; }
  .pin-err-msg{ color:var(--danger); font-size:12px; height:16px; margin-top:14px; }

  /* ---------- APP SHELL ---------- */
  #app{ display:none; }
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--ink);
    border-bottom:1px solid rgba(184,134,58,0.25);
    padding:14px 18px;
  }
  .topbar-inner{ max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand-seal{ width:34px;height:34px;border:1.5px solid var(--stamp); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--stamp); font-size:15px; flex-shrink:0;}
  .brand-name{ color:var(--paper); font-weight:700; font-size:16px; }
  .search-wrap{ position:relative; flex:1; min-width:180px; max-width:360px;}
  .search-input{
    width:100%; padding:10px 14px 10px 36px; border-radius:20px; border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.06); color:var(--paper); font-size:14px; outline:none;
  }
  .search-input::placeholder{ color:#8b98b3; }
  .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#8b98b3; font-size:14px;}
  .btn{
    padding:10px 16px; border-radius:20px; border:none; font-size:14px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-add{ background:var(--stamp); color:var(--ink); }
  .btn-add:active{ background:var(--stamp-dark); }
  .btn-ghost{ background:rgba(255,255,255,0.08); color:var(--paper); border:1px solid rgba(255,255,255,0.14); }

  .content{ max-width:1100px; margin:0 auto; padding:18px; }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 16px; }
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:16px; font-size:13px; font-weight:600;
    background:var(--paper); border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  }
  .chip.active{ background:var(--stamp); border-color:var(--stamp); color:#fff; }

  .section-title{ color:var(--paper); font-size:13px; text-transform:uppercase; letter-spacing:0.08em; margin:22px 0 10px; opacity:0.75; display:flex; align-items:center; gap:8px;}

  .folder-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .folder-card{
    flex-shrink:0; width:118px; background:var(--paper); border-radius:var(--radius); padding:12px;
    border:1px solid var(--line); cursor:pointer; box-shadow:var(--shadow);
  }
  .folder-card.active{ outline:2px solid var(--stamp); }
  .folder-icon{ font-size:22px; margin-bottom:6px; }
  .folder-name{ font-size:12.5px; font-weight:700; line-height:1.25; }
  .folder-count{ font-size:11px; color:var(--text-dim); margin-top:3px;}
  .folder-add{ display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-dim); border-style:dashed; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-top:10px;}
  .card{
    background:var(--paper); border-radius:var(--radius); padding:14px; border:1px solid var(--line);
    box-shadow:var(--shadow); position:relative; display:flex; flex-direction:column; gap:8px;
  }
  .card-top{ display:flex; align-items:flex-start; gap:10px; }
  .file-icon{ width:38px;height:38px; border-radius:8px; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .file-icon.img{ background:var(--stamp); }
  .file-name{ font-weight:700; font-size:14.5px; line-height:1.3; word-break:break-word; }
  .file-meta{ font-size:11.5px; color:var(--text-dim); }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:10px; background:var(--paper-2); color:var(--text-dim); }
  .badge.vehicle{ background:var(--ink); color:var(--paper); }
  .badge.exp-ok{ background:rgba(61,107,79,0.14); color:var(--ok); }
  .badge.exp-soon{ background:rgba(184,134,58,0.18); color:var(--stamp-dark); }
  .badge.exp-over{ background:rgba(164,64,47,0.16); color:var(--danger); }
  .card-actions{ display:flex; gap:6px; margin-top:2px; flex-wrap:wrap; }
  .icon-btn{
    flex:1; padding:8px 4px; border-radius:8px; border:1px solid var(--line); background:#fff;
    font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:3px; min-width:0;
  }
  .icon-btn span.ico{ font-size:15px; }
  .icon-btn.danger{ color:var(--danger); }

  .empty{ text-align:center; padding:50px 20px; color:#a9b6cd; }
  .empty .ico{ font-size:34px; margin-bottom:10px; }

  /* ---------- MODALS ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(18,33,58,0.55); backdrop-filter:blur(2px); z-index:100; display:none; align-items:flex-end; justify-content:center; }
  .overlay.show{ display:flex; }
  @media(min-width:640px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--paper); width:100%; max-width:440px; border-radius:16px 16px 0 0; padding:22px;
    max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
  }
  @media(min-width:640px){ .modal{ border-radius:16px; } }
  .modal h3{ margin:0 0 16px; font-size:17px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); font-size:14.5px;
    background:#fff; color:var(--text); font-family:inherit;
  }
  .field-hint{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; justify-content:center; }
  .btn-cancel{ background:#fff; color:var(--text); border:1px solid var(--line); }
  .file-drop{
    border:2px dashed var(--line); border-radius:10px; padding:22px; text-align:center; cursor:pointer;
    color:var(--text-dim); font-size:13.5px; margin-bottom:14px; background:#fff;
  }
  .file-drop.has-file{ border-color:var(--stamp); color:var(--stamp-dark); font-weight:600; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:12px 20px; border-radius:20px; font-size:13.5px; z-index:300; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .fab{
    position:fixed; bottom:22px; right:18px; width:56px; height:56px; border-radius:50%; background:var(--stamp);
    color:var(--ink); font-size:26px; border:none; box-shadow:var(--shadow-lg); cursor:pointer; z-index:30;
    display:flex; align-items:center; justify-content:center;
  }

  #previewOverlay .modal{ max-width:640px; }
  #previewFrame{ width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  #previewImg{ width:100%; border-radius:8px; }

  .conn-dot{ width:8px; height:8px; border-radius:50%; background:#7d8ba6; }
  .conn-dot.on{ background:#5aa06f; }
  .conn-dot.off{ background:var(--danger); }
  .conn-wrap{ display:flex; align-items:center; gap:6px; font-size:11px; color:#a9b6cd; }
</style>
</head>
<body>

<!-- =================== PIN SCREEN =================== -->
<div id="pinScreen">
  <div class="pin-card">
    <div class="pin-seal">🔒</div>
    <p class="pin-title">Belge Yöneticisi</p>
    <p class="pin-sub">Devam etmek için şifreyi girin</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="pin-pad" id="pinPad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key ghost"></button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key ghost" id="pinBack">⌫</button>
    </div>
    <div class="pin-err-msg" id="pinErrMsg"></div>
  </div>
</div>

<!-- =================== APP =================== -->
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-seal">📁</div>
        <div>
          <div class="brand-name">Belge Yöneticisi</div>
          <div class="conn-wrap"><span class="conn-dot" id="connDot"></span><span id="connText">bağlanıyor…</span></div>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="Belge ara… (örn. kasko)">
      </div>
      <button class="btn btn-ghost" id="newFolderBtn">+ Klasör</button>
    </div>
  </div>

  <div class="content">
    <div class="chips" id="vehicleChips"></div>

    <div class="section-title">📂 Klasörler</div>
    <div class="folder-row" id="folderRow"></div>

    <div class="section-title" id="listTitle">🕓 Son Eklenenler</div>
    <div class="grid" id="fileGrid"></div>
    <div class="empty" id="emptyState" style="display:none;">
      <div class="ico">📄</div>
      <div>Henüz belge yok. Sağ alttaki + ile ekleyebilirsin.</div>
    </div>
  </div>

  <button class="fab" id="fabAdd">+</button>
</div>

<!-- =================== ADD/EDIT FILE MODAL =================== -->
<div class="overlay" id="fileOverlay">
  <div class="modal">
    <h3 id="fileModalTitle">Belge Ekle</h3>
    <div class="file-drop" id="fileDrop">📎 Dosya seç (PDF, resim)</div>
    <input type="file" id="fileInput" accept=".pdf,image/*" style="display:none;">
    <div class="field">
      <label>Belge adı</label>
      <input type="text" id="fName" placeholder="örn. Kasko Poliçesi">
    </div>
    <div class="field">
      <label>Klasör</label>
      <select id="fFolder"></select>
    </div>
    <div class="field">
      <label>Araç (opsiyonel)</label>
      <select id="fVehicle">
        <option value="">— Genel —</option>
      </select>
    </div>
    <div class="field">
      <label>Son geçerlilik tarihi (opsiyonel)</label>
      <input type="date" id="fExpiry">
      <div class="field-hint">Girersen, süresi yaklaşınca kartta uyarı görünür.</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="fileCancelBtn">Vazgeç</button>
      <button class="btn btn-add" id="fileSaveBtn">Kaydet</button>
    </div>
  </div>
</div>

<!-- =================== FOLDER MODAL =================== -->
<div class="overlay" id="folderOverlay">
  <div class="modal">
    <h3>Yeni Klasör</h3>
    <div class="field">
      <label>Klasör adı</label>
      <input type="text" id="folderNameInput" placeholder="örn. 07T3315 Belgeleri">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="folderCancelBtn">Vazgeç</button>
      <button class="btn btn-add" id="folderSaveBtn">Oluştur</button>
    </div>
  </div>
</div>

<!-- =================== RENAME/MOVE MODAL =================== -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3>Belgeyi Düzenle</h3>
    <div class="field">
      <label>Belge adı</label>
      <input type="text" id="eName">
    </div>
    <div class="field">
      <label>Klasör</label>
      <select id="eFolder"></select>
    </div>
    <div class="field">
      <label>Araç</label>
      <select id="eVehicle"><option value="">— Genel —</option></select>
    </div>
    <div class="field">
      <label>Son geçerlilik tarihi</label>
      <input type="date" id="eExpiry">
    </div>
    <div class="modal-actions">
      <button class="btn icon-btn danger" id="deleteBtn" style="flex:0.6;">🗑 Sil</button>
      <button class="btn btn-cancel" id="editCancelBtn">Vazgeç</button>
      <button class="btn btn-add" id="editSaveBtn">Kaydet</button>
    </div>
  </div>
</div>

<!-- =================== PREVIEW MODAL =================== -->
<div class="overlay" id="previewOverlay">
  <div class="modal">
    <h3 id="previewTitle">Önizleme</h3>
    <div id="previewBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="previewCloseBtn">Kapat</button>
      <button class="btn btn-add" id="previewShareBtn">📤 Paylaş</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   FIREBASE YAPILANDIRMASI — BURAYI DOLDUR
   1) https://console.firebase.google.com adresinden yeni bir proje aç
      (taksi sistemindeki projeden AYRI, yeni bir proje olsun)
   2) Proje ayarları > Web uygulaması ekle, sana verilecek "firebaseConfig"
      nesnesini aşağıya yapıştır.
   3) Firestore Database'i "production mode" ile oluştur.
   4) Storage'ı aktif et (bunun için Blaze planına geçmen gerekecek —
      ödeme yöntemi eklemen istenir, ama bu projede kullanım küçük
      olduğu için aylık maliyet genelde $1'in altında kalır).
   5) Firestore ve Storage kurallarını en altta verdiğim şekilde ayarla.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDbPWREAyl5MrovKvbbm0ub0JdXvIksdBo",
  authDomain: "data-ad834.firebaseapp.com",
  projectId: "data-ad834",
  storageBucket: "data-ad834.firebasestorage.app",
  messagingSenderId: "848177101068",
  appId: "1:848177101068:web:0328f7b4d0fdfb5cdff129"
};

/* Şifre — istersen değiştirebilirsin */
const APP_PIN = "1980";

/* Araç plakaları — filtre çiplerinde gösterilir */
const VEHICLES = ["07T3315", "07T3361", "07T2452"];

/* ========================================================================= */

let db, storage, firebaseOk = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  storage = firebase.storage();
  firebaseOk = true;
}catch(e){ console.error("Firebase başlatılamadı:", e); }

const state = {
  files: [],
  folders: [],
  activeFolder: null,
  activeVehicle: null,
  search: "",
  pendingFile: null
};

/* ---------------- helpers ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmtDate(d){
  if(!d) return "";
  const dt = (d.toDate) ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('tr-TR');
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function expiryBadge(dateStr){
  if(!dateStr) return "";
  const d = daysUntil(dateStr);
  if(d < 0) return `<span class="badge exp-over">⚠ ${Math.abs(d)} gün geçti</span>`;
  if(d <= 15) return `<span class="badge exp-soon">⏰ ${d} gün kaldı</span>`;
  return `<span class="badge exp-ok">✓ ${fmtDate(dateStr)}</span>`;
}
function isImage(name){ return /\.(png|jpe?g|gif|webp|heic)$/i.test(name||""); }

/* ---------------- PIN screen ---------------- */
(function initPin(){
  let entered = "";
  const dots = document.querySelectorAll('#pinDots .pin-dot');
  const errMsg = document.getElementById('pinErrMsg');

  if(sessionStorage.getItem('bygc_unlocked') === '1'){
    unlock();
    return;
  }

  function render(){
    dots.forEach((d,i)=>{
      d.classList.toggle('filled', i < entered.length);
      d.classList.remove('err');
    });
  }
  function shake(){
    dots.forEach(d=>d.classList.add('err'));
    errMsg.textContent = "Yanlış şifre, tekrar deneyin";
    setTimeout(()=>{ entered=""; render(); errMsg.textContent=""; }, 500);
  }
  function unlock(){
    sessionStorage.setItem('bygc_unlocked','1');
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  }

  document.getElementById('pinPad').addEventListener('click', (e)=>{
    const btn = e.target.closest('.pin-key');
    if(!btn) return;
    if(btn.id === 'pinBack'){ entered = entered.slice(0,-1); render(); return; }
    const k = btn.dataset.k;
    if(k === undefined) return;
    if(entered.length >= 4) return;
    entered += k;
    render();
    if(entered.length === 4){
      setTimeout(()=>{
        if(entered === APP_PIN){ unlock(); }
        else shake();
      }, 120);
    }
  });
})();

/* ---------------- App init ---------------- */
function initApp(){
  document.getElementById('connText').textContent = firebaseOk ? "bağlanıyor…" : "yapılandırma eksik";

  buildVehicleChips();
  bindUI();

  if(!firebaseOk){
    toast("Firebase yapılandırması eksik — kod içindeki firebaseConfig alanını doldur.");
    setConn(false);
    return;
  }

  db.collection('folders').orderBy('createdAt','asc').onSnapshot(snap=>{
    state.folders = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderFolders();
    fillFolderSelects();
  }, err=>{ console.error(err); setConn(false); });

  db.collection('files').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.files = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderFiles();
    setConn(true);
  }, err=>{ console.error(err); setConn(false); toast("Bağlantı hatası: " + err.message); });
}

function setConn(ok){
  document.getElementById('connDot').className = 'conn-dot ' + (ok ? 'on':'off');
  document.getElementById('connText').textContent = ok ? "senkronize" : "bağlantı yok";
}

function buildVehicleChips(){
  const wrap = document.getElementById('vehicleChips');
  const allChip = `<div class="chip active" data-v="">Tümü</div>`;
  const vehicleChips = VEHICLES.map(v=>`<div class="chip" data-v="${v}">${v}</div>`).join('');
  wrap.innerHTML = allChip + vehicleChips + `<div class="chip" data-v="__general__">Genel</div>`;
  wrap.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    wrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.activeVehicle = chip.dataset.v || null;
    renderFiles();
  });
}

function renderFolders(){
  const row = document.getElementById('folderRow');
  const cards = state.folders.map(f=>{
    const count = state.files.filter(x=>x.folderId===f.id).length;
    return `<div class="folder-card ${state.activeFolder===f.id?'active':''}" data-id="${f.id}">
      <div class="folder-icon">📁</div>
      <div class="folder-name">${escapeHtml(f.name)}</div>
      <div class="folder-count">${count} belge</div>
    </div>`;
  }).join('');
  const allCard = `<div class="folder-card ${state.activeFolder===null?'active':''}" data-id="">
      <div class="folder-icon">🗂</div>
      <div class="folder-name">Tüm Belgeler</div>
      <div class="folder-count">${state.files.length} belge</div>
    </div>`;
  row.innerHTML = allCard + cards;
  row.querySelectorAll('.folder-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      state.activeFolder = c.dataset.id || null;
      renderFolders();
      renderFiles();
    });
  });
}

function fillFolderSelects(){
  const opts = state.folders.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
  ['fFolder','eFolder'].forEach(id=>{
    document.getElementById(id).innerHTML = opts || '<option value="">Önce klasör oluştur</option>';
  });
  const vOpts = VEHICLES.map(v=>`<option value="${v}">${v}</option>`).join('');
  document.getElementById('fVehicle').innerHTML = '<option value="">— Genel —</option>' + vOpts;
  document.getElementById('eVehicle').innerHTML = '<option value="">— Genel —</option>' + vOpts;
}

function currentFiltered(){
  let list = state.files;
  if(state.activeFolder) list = list.filter(f=>f.folderId===state.activeFolder);
  if(state.activeVehicle === '__general__') list = list.filter(f=>!f.vehicle);
  else if(state.activeVehicle) list = list.filter(f=>f.vehicle===state.activeVehicle);
  if(state.search){
    const s = state.search.toLowerCase();
    list = list.filter(f=>(f.name||"").toLowerCase().includes(s));
  }
  return list;
}

function renderFiles(){
  const grid = document.getElementById('fileGrid');
  const list = currentFiltered();
  document.getElementById('listTitle').innerHTML = state.search || state.activeFolder || state.activeVehicle
    ? '📄 Belgeler' : '🕓 Son Eklenenler';
  const showList = (state.search || state.activeFolder || state.activeVehicle) ? list : list.slice(0,8);

  document.getElementById('emptyState').style.display = showList.length ? 'none' : 'block';
  grid.innerHTML = showList.map(f=>{
    const folder = state.folders.find(x=>x.id===f.folderId);
    return `<div class="card" data-id="${f.id}">
      <div class="card-top">
        <div class="file-icon ${isImage(f.storageName)?'img':''}">${isImage(f.storageName)?'🖼':'📄'}</div>
        <div>
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${folder ? escapeHtml(folder.name) : ''}${folder && f.createdAt ? ' · ' : ''}${f.createdAt ? fmtDate(f.createdAt) : ''}</div>
        </div>
      </div>
      <div class="badge-row">
        ${f.vehicle ? `<span class="badge vehicle">${f.vehicle}</span>` : ''}
        ${expiryBadge(f.expiry)}
      </div>
      <div class="card-actions">
        <button class="icon-btn" data-act="preview"><span class="ico">👁</span>Önizle</button>
        <button class="icon-btn" data-act="share"><span class="ico">📤</span>Paylaş</button>
        <button class="icon-btn" data-act="edit"><span class="ico">✏️</span>Düzenle</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;
    const file = state.files.find(f=>f.id===id);
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const act = btn.dataset.act;
        if(act==='preview') openPreview(file);
        if(act==='share') shareFile(file);
        if(act==='edit') openEdit(file);
      });
    });
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Search ---------------- */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.search = e.target.value.trim();
  renderFiles();
});

/* ---------------- Folder modal ---------------- */
function bindUI(){
  document.getElementById('newFolderBtn').addEventListener('click', ()=>{
    document.getElementById('folderNameInput').value = '';
    document.getElementById('folderOverlay').classList.add('show');
  });
  document.getElementById('folderCancelBtn').addEventListener('click', ()=>{
    document.getElementById('folderOverlay').classList.remove('show');
  });
  document.getElementById('folderSaveBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('folderNameInput').value.trim();
    if(!name){ toast('Klasör adı gerekli'); return; }
    try{
      await db.collection('folders').add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('folderOverlay').classList.remove('show');
      toast('Klasör oluşturuldu');
    }catch(e){ toast('Hata: ' + e.message); }
  });

  /* ---------------- Add file modal ---------------- */
  document.getElementById('fabAdd').addEventListener('click', openAddModal);
  document.getElementById('fileCancelBtn').addEventListener('click', ()=>{
    document.getElementById('fileOverlay').classList.remove('show');
  });
  document.getElementById('fileDrop').addEventListener('click', ()=>{
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    state.pendingFile = file;
    document.getElementById('fileDrop').textContent = '📎 ' + file.name;
    document.getElementById('fileDrop').classList.add('has-file');
    if(!document.getElementById('fName').value){
      document.getElementById('fName').value = file.name.replace(/\.[^.]+$/, '');
    }
  });
  document.getElementById('fileSaveBtn').addEventListener('click', saveNewFile);

  /* ---------------- Edit modal ---------------- */
  document.getElementById('editCancelBtn').addEventListener('click', ()=>{
    document.getElementById('editOverlay').classList.remove('show');
  });
  document.getElementById('editSaveBtn').addEventListener('click', saveEdit);
  document.getElementById('deleteBtn').addEventListener('click', deleteFile);

  /* ---------------- Preview modal ---------------- */
  document.getElementById('previewCloseBtn').addEventListener('click', ()=>{
    document.getElementById('previewOverlay').classList.remove('show');
  });
  document.getElementById('previewShareBtn').addEventListener('click', ()=>{
    const id = document.getElementById('previewOverlay').dataset.fileId;
    const file = state.files.find(f=>f.id===id);
    if(file) shareFile(file);
  });

  document.querySelectorAll('.overlay').forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target === ov) ov.classList.remove('show'); });
  });
}

function openAddModal(){
  if(!state.folders.length){
    toast('Önce bir klasör oluştur (üstteki + Klasör butonu)');
    return;
  }
  state.pendingFile = null;
  document.getElementById('fileModalTitle').textContent = 'Belge Ekle';
  document.getElementById('fName').value = '';
  document.getElementById('fExpiry').value = '';
  document.getElementById('fFolder').value = state.activeFolder || state.folders[0].id;
  document.getElementById('fVehicle').value = state.activeVehicle && state.activeVehicle!=='__general__' ? state.activeVehicle : '';
  document.getElementById('fileDrop').textContent = '📎 Dosya seç (PDF, resim)';
  document.getElementById('fileDrop').classList.remove('has-file');
  document.getElementById('fileInput').value = '';
  document.getElementById('fileOverlay').classList.add('show');
}

async function saveNewFile(){
  const name = document.getElementById('fName').value.trim();
  const folderId = document.getElementById('fFolder').value;
  const vehicle = document.getElementById('fVehicle').value;
  const expiry = document.getElementById('fExpiry').value;

  if(!state.pendingFile){ toast('Bir dosya seç'); return; }
  if(!name){ toast('Belge adı gir'); return; }
  if(!folderId){ toast('Klasör seç'); return; }

  const saveBtn = document.getElementById('fileSaveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'Yükleniyor…';

  try{
    const file = state.pendingFile;
    const storagePath = `documents/${Date.now()}_${file.name}`;
    const ref = storage.ref(storagePath);
    await ref.put(file);
    const url = await ref.getDownloadURL();

    await db.collection('files').add({
      name, folderId, vehicle: vehicle || null, expiry: expiry || null,
      storagePath, storageName: file.name, url,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('fileOverlay').classList.remove('show');
    toast('Belge kaydedildi');
  }catch(e){
    toast('Hata: ' + e.message);
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = 'Kaydet';
  }
}

/* ---------------- Edit / delete ---------------- */
let editingId = null;
function openEdit(file){
  editingId = file.id;
  document.getElementById('eName').value = file.name;
  document.getElementById('eFolder').value = file.folderId;
  document.getElementById('eVehicle').value = file.vehicle || '';
  document.getElementById('eExpiry').value = file.expiry || '';
  document.getElementById('editOverlay').classList.add('show');
}
async function saveEdit(){
  const name = document.getElementById('eName').value.trim();
  const folderId = document.getElementById('eFolder').value;
  const vehicle = document.getElementById('eVehicle').value;
  const expiry = document.getElementById('eExpiry').value;
  if(!name){ toast('Belge adı gerekli'); return; }
  try{
    await db.collection('files').doc(editingId).update({
      name, folderId, vehicle: vehicle || null, expiry: expiry || null
    });
    document.getElementById('editOverlay').classList.remove('show');
    toast('Güncellendi');
  }catch(e){ toast('Hata: ' + e.message); }
}
async function deleteFile(){
  if(!confirm('Bu belgeyi silmek istediğine emin misin?')) return;
  const file = state.files.find(f=>f.id===editingId);
  try{
    if(file && file.storagePath){
      try{ await storage.ref(file.storagePath).delete(); }catch(e){ console.warn(e); }
    }
    await db.collection('files').doc(editingId).delete();
    document.getElementById('editOverlay').classList.remove('show');
    toast('Belge silindi');
  }catch(e){ toast('Hata: ' + e.message); }
}

/* ---------------- Preview / share ---------------- */
function openPreview(file){
  document.getElementById('previewOverlay').dataset.fileId = file.id;
  document.getElementById('previewTitle').textContent = file.name;
  const body = document.getElementById('previewBody');
  if(isImage(file.storageName)){
    body.innerHTML = `<img id="previewImg" src="${file.url}">`;
  }else{
    body.innerHTML = `<iframe id="previewFrame" src="${file.url}"></iframe>`;
  }
  document.getElementById('previewOverlay').classList.add('show');
}

function shareFile(file){
  if(navigator.share){
    navigator.share({ title: file.name, text: file.name, url: file.url }).catch(()=>{});
  }else{
    const waUrl = `https://wa.me/?text=${encodeURIComponent(file.name + ': ' + file.url)}`;
    window.open(waUrl, '_blank');
  }
}
</script>
</body>
